name: Build Windows Distribution

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Distribution
    runs-on: windows-2022

    env:
      npm_config_msvs_version: "2022"
      GYP_MSVS_VERSION: "2022"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.2
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust Engine Core
        run: |
          cargo build --release --manifest-path src-rust/Cargo.toml
          cargo test --all --manifest-path src-rust/Cargo.toml

      - name: Install Node dependencies
        run: npm ci

      - name: Build React UI
        run: npm run buildreact

      - name: Build Windows Distribution
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npx gulp vscode-win32-x64

      - name: Build Windows User Installer (.exe)
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npx gulp vscode-win32-x64-user-setup

      - name: Prepare Artifacts (Installer & Portable)
        shell: bash
        run: |
          # 1. Installer Setup Exe
          SETUP_EXE=".build/win32-x64/user-setup/VSCodeSetup.exe"
          if [ -f "$SETUP_EXE" ]; then
            cp "$SETUP_EXE" OrbitSetup-x64.exe
            echo "Installer created: OrbitSetup-x64.exe"
          else
            echo "Warning: $SETUP_EXE not found!"
          fi

          # 2. Portable Zip
          WIN_DIR="../Orbit-win32-x64"
          if [ ! -d "$WIN_DIR" ]; then
            WIN_DIR="../VSCode-win32-x64"
          fi
          
          mkdir -p "$WIN_DIR/data"
          7z a -tzip Orbit-win32-x64-portable.zip "$WIN_DIR/*"
          echo "Portable zip created: Orbit-win32-x64-portable.zip"

      - name: Upload Windows Installer (OrbitSetup-x64.exe)
        uses: actions/upload-artifact@v4
        with:
          name: OrbitSetup-x64
          path: OrbitSetup-x64.exe
          retention-days: 14

      - name: Upload Windows Portable (Orbit-win32-x64-portable.zip)
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-win32-x64-portable
          path: Orbit-win32-x64-portable.zip
          retention-days: 14

      - name: Create GitHub Release (Optional)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OrbitSetup-x64.exe
            Orbit-win32-x64-portable.zip
          name: Orbit ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
